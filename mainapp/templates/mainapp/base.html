<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Библиотека ВУЗа{% endblock %}</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #fdf2f4; color: #4a4a4a; }
        header { background: #f8bbd0; padding: 15px 30px; display: flex; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        header nav a { color: #2e7d32; text-decoration: none; margin-right: 20px; font-weight: bold; font-size: 16px; transition: 0.3s; }
        header nav a:hover { color: #1b5e20; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background-color: #a5d6a7; min-width: 160px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.1); z-index: 1; border-radius: 0 0 8px 8px; overflow: hidden; }
        .dropdown-content a { color: #1b5e20; padding: 12px 16px; text-decoration: none; display: block; margin: 0; }
        .dropdown-content a:hover { background-color: #81c784; }
        .dropdown:hover .dropdown-content { display: block; }
        
        main { padding: 40px; max-width: 800px; margin: 30px auto; background: #ffffff; min-height: 400px; border-radius: 12px; box-shadow: 0 8px 16px rgba(248, 187, 208, 0.2); border-top: 4px solid #a5d6a7; }
        h1 { color: #2e7d32; border-bottom: 2px solid #f8bbd0; padding-bottom: 10px; }
        p { line-height: 1.6; }
        footer { text-align: center; padding: 20px; color: #9e9e9e; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'mainapp:home' %}">Главная</a>
            <div class="dropdown">
                <a href="{% url 'mainapp:about' %}">О библиотеке ▼</a>
                <div class="dropdown-content">
                    <a href="{% url 'mainapp:contacts' %}">Контакты</a>
                    <a href="{% url 'mainapp:how_to_find' %}">Как нас найти</a>
                </div>
            </div>
            <a href="{% url 'mainapp:catalog' %}">Каталог книг</a>
            <a href="{% url 'mainapp:resources' %}">Электронные ресурсы</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        &copy; 2026 Библиотека МПТ. Все права защищены.
    </footer>
</body>
</html>
